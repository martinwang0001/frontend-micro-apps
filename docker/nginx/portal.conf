# ===============================================================
# 基座(portal)nginx 配置
# ---------------------------------------------------------------
# 基座是用户直接访问的入口,不需要 CORS(它不去 fetch 别人,
# 是别人被 fetch)。核心职责:SPA 路由回退 + 静态资源长缓存。
# ===============================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---- gzip ----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ---- 带内容哈希的静态资源:一年强缓存 ----
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ---- SPA 回退 ----
    # 基座使用 history 路由(如 /app-style-lab、/app-aggregate),
    # 刷新或直链时必须回退到 index.html,否则 404
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
