# ===============================================================
# 子应用 nginx 配置(8 个子应用共用)
# ---------------------------------------------------------------
# 【微前端关键点】qiankun 主应用通过 fetch 拉取子应用入口 HTML 与
# 静态资源(跨端口 = 跨域),因此子应用必须放开 CORS,否则浏览器拦截。
# ===============================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---- gzip:微前端下 JS 体积大,压缩收益明显 ----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ---- CORS:qiankun fetch 的硬性要求 ----
    # 注意:示例项目放开为 *,生产环境建议收敛为基座的具体 Origin
    add_header Access-Control-Allow-Origin  "*" always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
    add_header Access-Control-Allow-Headers "*" always;

    # 预检请求直接放行(qiankun 拉取 HTML 属简单请求,但保险起见处理 OPTIONS)
    if ($request_method = OPTIONS) {
        return 204;
    }

    # ---- 带内容哈希的静态资源:一年强缓存 + immutable ----
    # 注意:location 内一旦出现 add_header,会覆盖 server 级的全部 add_header,
    # 因此 CORS 头必须在这里重复声明(nginx 经典坑点)
    location /assets/ {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ---- 入口与 SPA 回退 ----
    # 子应用在 qiankun 模式下使用 memory 路由,理论上无需回退;
    # 保留 try_files 以支持独立直访调试(standalone 模式用 web history)
    location / {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
