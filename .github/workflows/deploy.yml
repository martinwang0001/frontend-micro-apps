# ===============================================================
# GitHub Actions: Gitee 同步 + 合并部署到 Cloudflare Pages
# ===============================================================
name: Sync Gitee & Deploy to Cloudflare Pages

on:
  push:
    branches: [master, main]
  schedule:
    # 每 6 小时从 Gitee 同步一次（Gitee 上的更新不会触发 GitHub push）
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write      # 同步 job 需要写权限推送代码
  deployments: write

concurrency:
  group: cf-pages-deploy
  cancel-in-progress: true

jobs:
  # ---------- Job 1: 从 Gitee 同步到 GitHub ----------
  sync:
    runs-on: ubuntu-latest
    # push 触发时跳过：push 本身就是 GitHub 上的更新，不需要反向同步
    if: github.event_name != 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Gitee SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GITEE_PRIVATE_KEY }}" > ~/.ssh/gitee_key
          chmod 600 ~/.ssh/gitee_key
          ssh-keyscan -H gitee.com >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<EOF
          Host gitee.com
            IdentityFile ~/.ssh/gitee_key
            StrictHostKeyChecking no
          EOF

      - name: Sync from Gitee
        run: |
          git remote add gitee git@gitee.com:你的用户名/你的仓库名.git
          git fetch gitee --tags
          # 同步所有分支（GitHub 上分叉会失败，不会强推；需要强制镜像可加 --force）
          git push origin "refs/remotes/gitee/*:refs/heads/*"
          git push origin --tags

  # ---------- Job 2: 构建并部署 Cloudflare Pages ----------
  deploy:
    runs-on: ubuntu-latest
    needs: [sync]
    # sync 被跳过（push 触发）或成功时都执行；sync 失败则不部署旧代码
    if: always() && (needs.sync.result == 'success' || needs.sync.result == 'skipped')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0   # 确保拿到 sync 刚推送的最新 commit

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build merged dist
        run: node scripts/merge-dist.mjs

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist-merged --project-name=frontend-micro-apps --branch=main